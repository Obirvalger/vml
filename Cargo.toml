[package]
name = "vml"
version = "0.1.14"
rust-version = "1.97"
authors = ["Mikhail Gordeev <obirvalger@altlinux.org>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.65"
# Due to broken Byte deserialization in 5 version
byte-unit = { version = "<5", default-features = false, features = ["serde", "std"] }
clap = { version = "<4", features = ["unstable-replace", "cargo"] }
clap_complete = "<4"
cmd_lib.git = "https://github.com/rust-shell-script/rust_cmd_lib"
cmd_lib.rev = "5a87af574a694fbfd0d4ade0c9b3dadc7cd463f6"
comfy-table = "8.0.0"
env_logger = "0.11.2"
file-lock = "2.1.10"
futures-util = "0.3.30"
indicatif = "0.18.6"
infer = "0.22.0"
json = "0.12.4"
log = { version = "0.4.20", features = ["serde"] }
procfs = "0.18.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }
rust-embed = "8.5.0"
serde = { version = "1.0.145", features = ["derive"] }
shellexpand = "3.1.0"
tempfile = "3.3.0"
tera = "2.3.0"
thiserror = "2.0.20"
tokio = { version = "1.13.0", features = ["full"] }
toml = "1.1.5"
urlencoding = "2.1.2"
walkdir = "2.3.2"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
